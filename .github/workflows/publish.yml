name: Publish npm package

# Pushing tag v<package.json version> publishes. A prerelease version goes to
# npm `next`; any other version goes to `latest`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Match tag to package version
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version"
          case "$version" in *-*) dist_tag=next ;; *) dist_tag=latest ;; esac
          echo "NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: node scripts/materialize-beads-linux-amd64.cjs
      # Keep the same deterministic carrier surface as CI.
      - run: TERM_PROGRAM=iTerm.app npm run test:full
      - run: npm run test:lanes
      - run: npm run verify:package
      - run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/release/$GITHUB_REF_NAME-release-notes.md"
          if [ -f "$notes" ]; then flags=(--notes-file "$notes"); else flags=(--generate-notes); fi
          if [ "$NPM_DIST_TAG" = next ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" "${flags[@]}"
