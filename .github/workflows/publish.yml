name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify all release gates without publishing (set false only to publish)
        required: true
        default: true
        type: boolean
      tag:
        description: npm dist-tag used only when dry_run is false
        required: true
        default: next
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: node scripts/materialize-beads-linux-amd64.cjs
      # Keep the same deterministic carrier surface as CI.
      - run: TERM_PROGRAM=iTerm.app npm test
      - run: npm run verify:package
      - if: inputs.dry_run == false
        run: npm publish --access public --provenance --tag "${{ inputs.tag }}"
