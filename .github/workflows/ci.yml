name: CI

# Every job runs in parallel; wall time is the slowest shard (~30 s), not the
# sum. A tree that already passed is recorded by the `ci` gate and skipped on
# re-runs (merge push, release tag). Require only the `ci` check on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  # Contract tests exercise a terminal carrier; use the deterministic adapter
  # surface rather than depending on a hosted runner's terminal.
  TERM_PROGRAM: iTerm.app

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}
      - if: steps.prepare.outputs.verified != 'true'
        run: |
          npm run typecheck & typecheck=$!
          npm run verify:package
          wait "$typecheck"
          npm run test:lanes

  # The fast lane (`npm test` minus typecheck, which `check` runs) on the
  # minimum supported and the publish Node.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 22.x, shard: 1/5 }
          - { node: 22.x, shard: 2/5 }
          - { node: 22.x, shard: 3/5 }
          - { node: 22.x, shard: 4/5 }
          - { node: 22.x, shard: 5/5 }
          - { node: 24.x, shard: 1/3 }
          - { node: 24.x, shard: 2/3 }
          - { node: 24.x, shard: 3/3 }
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: ${{ matrix.node }}
      - if: steps.prepare.outputs.verified != 'true'
        run: npx vitest run --shard=${{ matrix.shard }}

  # `npm run test:exhaustive-only`, split into deterministic shards whose union
  # is the whole lane (see scripts/run-exhaustive-tests.cjs), on the publish Node.
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/10, 2/10, 3/10, 4/10, 5/10, 6/10, 7/10, 8/10, 9/10, 10/10]
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        uses: ./.github/actions/prepare
        with:
          node-version: 24.x
      - if: steps.prepare.outputs.verified != 'true'
        run: node scripts/run-exhaustive-tests.cjs vitest.exhaustive.config.ts --shard=${{ matrix.shard }} --lanes=4

  ci:
    if: always()
    needs: [check, test, exhaustive]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - uses: actions/checkout@v4
      - id: record
        run: echo "name=$(.github/scripts/ci-verified.sh name)" >> "$GITHUB_OUTPUT"
      - run: echo "${{ github.sha }} ${{ github.run_id }}" > ci-verified.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record.outputs.name }}
          path: ci-verified.txt
          retention-days: 90
          overwrite: true
