name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Contract tests exercise a terminal carrier; use the deterministic
      # adapter surface rather than depending on a hosted runner's terminal.
      - run: TERM_PROGRAM=iTerm.app npm test
      # The v3.1 simulator campaign exceeds 60 min on Node 22 and takes about
      # 20 min on Node 24. Run the exhaustive lane once, on the publish Node.
      - if: matrix.node == '24.x'
        run: TERM_PROGRAM=iTerm.app npm run test:exhaustive-only
      - run: npm run test:lanes
      - run: npm run verify:package

  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch pinned TLC artifact
        run: curl --fail --location --retry 2 https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar --output "$RUNNER_TEMP/tla2tools.jar"
      - name: Check bounded models and negative controls
        env:
          TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
          FORMAL_RESULTS_DIR: ${{ runner.temp }}/formal-results
        run: bash scripts/formal-check.sh
      - name: Retain model checker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-results
          path: ${{ runner.temp }}/formal-results
